volumes:
  elasticsearch-data:
    driver: local
    driver_opts:
      type: none
      device: /vol-route/elasticsearch-data
  grafana-data:
    driver: local
    driver_opts:
      type: none
      device: /vol-route/grafana-data
  prometheus-data:
    driver: local
    driver_opts:
      type: none
      device: /vol-route/prometheus-data