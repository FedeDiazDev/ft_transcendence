input {
    gelf {
        port => 12201
    }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
    index => "logstash-%{container_name}-%{+YYYY.MM.dd}"
    manage_template => false
  }
}


filter {
  if [level] == "debug" {
    drop { }
    }
    throttle {
        before_count => 5
        after_count => 1
        period => 60
        key => "%{container_name}"
    }
    mutate {
        gsub => [ "container_name", "^/", "" ]
    }
}

