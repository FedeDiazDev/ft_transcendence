input {
  gelf {
    port => 12201
  }
}

filter {
  # Drop debug logs to reduce noise
  if [level] == "debug" {
    drop { }
  }

  # Throttle logs
  throttle {
    before_count => 5
    after_count => 1
    period => 60
    key => "%{container_name}"
  }

  mutate {
    gsub => [ "container_name", "^/", "" ]
  }

  if [container_name] =~ /nginx/ {
    mutate { add_field => { "log_type" => "nginx" } }
  } else if [container_name] =~ /auth-service/ {
    mutate { add_field => { "log_type" => "auth" } }
  } else if [container_name] =~ /stats-service/ {
    mutate { add_field => { "log_type" => "stats" } }
  } else if [container_name] =~ /game-service/ {
    mutate { add_field => { "log_type" => "game" } }
  } else if [container_name] =~ /users-service/ {
    mutate { add_field => { "log_type" => "users" } }
  } else if [container_name] =~ /rabbitmq/ {
    mutate { add_field => { "log_type" => "rabbitmq" } }
  } else {
    mutate { add_field => { "log_type" => "unknown" } }
  }

  if [log_type] == "nginx" {
    grok {
      match => { "message" => "%{COMBINEDAPACHELOG}" }
      overwrite => [ "message" ]
    }
  }

  if [log_type] in ["auth", "stats", "users", "game"] {
    json {
      source => "message"
      skip_on_invalid_json => true
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
    index => "logstash-%{log_type}-%{+YYYY.MM.dd}"
    manage_template => false
  }
}
