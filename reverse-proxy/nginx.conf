worker_processes auto;

events {
    worker_connections 1024;
}

http {
	access_log /dev/stdout;
    error_log /dev/stderr warn;

	include /etc/nginx/mime.types;
    sendfile on;

	upstream	auth-service {
		server auth-service:3000;
	}

	upstream	users-service {
		server users-service:3000;
	}

	upstream	game-service {
		server	game-service:3000;
	}

	server {
		listen			8080;
		server_name	transcendence.fr;

		# Redirect HTTP to HTTPS
		return 301 https://$host$request$uri;
	}

	server {
		listen 443	ssl;
		server_name transcendence.fr;

		ssl_certificate		/etc/ssl/certs/nginx.crt;
		ssl_certificate_key	/etc/ssl/private/nginx.key;
		ssl_protocols		TLSv1.2 TLSv1.3;

		location / {
			index index.html;
			root /var/www/html;
			try_files $uri $uri/ /index.html; 
		}

		# Reverse proxy for /api/auth/
		location /api/auth {
			proxy_pass http://auth-service;  # Proxy to the backend API - Auth

			add_header 'Access-Control-Allow-Origin' ''; 
			add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE';
			add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization';
			add_header 'Access-Control-Allow-Credentials' 'true';

			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

		# Reverse proxy for /api/users/
		location /api/users {
			proxy_pass http://users-service;  # Proxy to the backend API - Users

			add_header 'Access-Control-Allow-Origin' ''; 
			add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE';
			add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization';
			add_header 'Access-Control-Allow-Credentials' 'true';

			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

	 	# Reverse proxy for /api/game/
		location /api/game/ {
				proxy_pass http://game-service;  # Proxy to the backend API - Game

				add_header 'Access-Control-Allow-Origin' ''; 
				add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE';
				add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization';
				add_header 'Access-Control-Allow-Credentials' 'true';


				proxy_set_header Host $host;
				proxy_set_header X-Real-IP $remote_addr;
				proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
				proxy_set_header X-Forwarded-Proto $scheme;

				# Websocket support
				proxy_http_version 1.1;
				proxy_set_header Upgrade $http_upgrade;
				proxy_set_header Connection "upgrade";
		}
		# Further Services here with same configuration. Backend routes MUST start with whatever location was declared in nginx.conf
	}
}
