services:
  nginx:
    container_name: nginx-lb
    build:
      context: ./reverse-proxy
      dockerfile: Dockerfile
    ports:
    # Port 8080:443 mapping means: 1. host machine exposes port 8080, 2. nginx listens on port 443
    # Useful when you can't expose a priviledged port but want to run the service as priviledged
      - "8080:443"
    volumes:
      - front-spa:/var/www/html
    depends_on:
      - frontend
      - auth-service
      - users-service
    networks:
      - transcendence-network
    logging:
      driver: gelf
      options:
        gelf-address: "udp://localhost:12201"
        tag: "transcendence"
    profiles: ["app"]

  frontend:
    container_name: frontend-spa
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - front-spa:/usr/src/app/
    networks:
      - transcendence-network
    profiles: ["app"]

  auth-service:
    container_name: auth-service
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    env_file:
      - .env 
    volumes:
      - auth-db:/data/
    networks:
      - transcendence-network
    logging:
      driver: gelf
      options:
        gelf-address: "udp://localhost:12201"
        tag: "transcendence"
    profiles: ["app"]

  game-service:
    container_name: game-service
    build:
      context: ./backend/game
      dockerfile: Dockerfile
    volumes:
      - game-data-db:/data    # SQLite
    networks:
      - transcendence-network
    logging:
      driver: gelf
      options:
        gelf-address: "udp://localhost:12201"
        tag: "transcendence"
    profiles: ["app"]

  users-service:
    container_name: users-service
    build:
      context: ./users-service
      dockerfile: Dockerfile
    volumes:
      - users-db:/data/
    networks:
      - transcendence-network
    env_file:
      - .env
    logging:
      driver: gelf
      options:
        gelf-address: "udp://localhost:12201"
        tag: "transcendence"
    profiles: ["app"]

  # Other services here
  elasticsearch:
    container_name: elasticsearch
    image: elasticsearch:8.18.0
    volumes:
      - elasticsearch:/usr/share/elasticsearch/data
      - ./monitoring/elk/elasticsearch/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml
    environment:
      - discovery.type=single-node
      - http.host=0.0.0.0
      - transport.host=0.0.0.0
      - xpack.security.enabled=false
    ports:
      - 9200:9200
    networks:
      - transcendence-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 30s
      timeout: 10s
      retries: 5
    mem_limit: 1gb
    profiles: ["monitoring"]
  
  logstash:
    container_name: logstash
    image: logstash:8.18.0
    volumes:
      - ./monitoring/elk/logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
      - ./monitoring/elk/logstash/logstash.yml:/usr/share/logstash/config/logstash.yml
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - 12201:12201/udp
    networks:
      - transcendence-network
    profiles: ["monitoring"]

# Generate keys: docker exec -it kibana /bin/bash /usr/share/kibana/bin/kibana-encryption-keys generate
# docker-compose restart kibana
  kibana:
    container_name: kibana
    image: kibana:8.18.0
    volumes:
      - ./monitoring/elk/kibana/kibana.yml:/usr/share/kibana/config/kibana.yml
      - kibana:/usr/share/kibana/data
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "5601:5601"
    networks:
      - transcendence-network
    logging:
      driver: gelf
      options:
        gelf-address: "udp://localhost:12201"
        tag: "transcendence"
    profiles: ["monitoring"]

volumes:
  front-spa:
  auth-db:
  game-data-db:
  users-db:
  elasticsearch:
  logstash:
  kibana:

networks:
  transcendence-network:
    driver: bridge
