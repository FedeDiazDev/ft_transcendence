services:
  nginx:
    container_name: nginx-lb
    build:
      context: ./reverse-proxy
      dockerfile: Dockerfile
    ports:
    # Port 8080:443 mapping means: 1. host machine exposes port 8080, 2. nginx listens on port 443
    # Useful when you can't expose a priviledged port but want to run the service as priviledged
      - "8080:443"
    volumes:
      - front-spa:/var/www/html
    depends_on:
      - frontend
      - auth-service
      - game-service
      - users-service
      - stats-service
      - rabbitmq
    networks:
      - transcendence-network

  frontend:
    container_name: frontend-spa
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - front-spa:/usr/src/app/
    networks:
      - transcendence-network

  auth-service:
    container_name: auth-service
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    env_file:
      - .env 
    volumes:
      - auth-db:/data/
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - transcendence-network

  stats-service:
    container_name: stats-service
    build:
      context: ./stats-service
      dockerfile: Dockerfile
    env_file:
      - .env 
    volumes:
      - stats-db:/data/
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - transcendence-network

  game-service:
    container_name: game-service
    build:
      context: ./backend/game
      dockerfile: Dockerfile
    volumes:
      - game-data-db:/data    # SQLite
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - transcendence-network

  users-service:
    container_name: users-service
    build:
      context: ./users-service
      dockerfile: Dockerfile
    volumes:
      - users-db:/data/
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - transcendence-network
    env_file:
      - .env
  
  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:3.13.7-management
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - transcendence-network
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"] 
      interval: 10s 
      retries: 5
      start_period: 30s
      timeout: 5s

volumes:
  front-spa:
  auth-db:
  game-data-db:
  users-db:
  stats-db:
  rabbitmq-data:

networks:
  transcendence-network:
    driver: bridge
