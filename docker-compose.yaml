services:
  nginx:
    container_name: nginx-lb
    build:
      context: ./reverse-proxy
      dockerfile: Dockerfile
    ports:
    # Port 8080:443 mapping means: 1. host machine exposes port 8080, 2. nginx listens on port 443
    # Useful when you can't expose a priviledged port but want to run the service as priviledged
      - "8080:443"
    volumes:
      - front-spa:/var/www/html
    depends_on:
      - frontend
      - auth-service
      - users-service
    networks:
      - transcendence-network

  frontend:
    container_name: frontend-spa
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - front-spa:/usr/src/app/
    networks:
      - transcendence-network

  auth-service:
    container_name: auth-service
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    env_file:
      - .env 
    volumes:
      - auth-db:/data/
    networks:
      - transcendence-network

  game-service:
    container_name: game-service
    build:
      context: ./backend/game
      dockerfile: Dockerfile
    volumes:
      - game-data-db:/data    # SQLite
    networks:
      - transcendence-network
  users-service:
    container_name: users-service
    build:
      context: ./users-service
      dockerfile: Dockerfile
    volumes:
      - users-db:/data/
    networks:
      - transcendence-network
    env_file:
      - .env 


  # Other services here
  elasticsearch:
    container_name: elasticsearch
    image: elasticsearch:8.18.0
    volumes:
      - elasticsearch:/usr/share/elasticsearch/data
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    networks:
      - transcendence-network
  
  kibana:
    container_name: kibana
    image: kibana:8.18.0
    depends_on:
      - elasticsearch
    ports:
      - "5601:5601"
    network:
      - transcendence-network

volumes:
  front-spa:
  auth-db:
  game-data-db:
  users-db:
  elasticsearch:

networks:
  transcendence-network:
    driver: bridge
